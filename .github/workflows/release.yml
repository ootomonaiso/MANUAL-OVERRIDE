name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  # auto-release.yml から呼び出す。タグ名を明示的に受け取る
  # （workflow_call では github.ref_name が呼び出し元の main になり、タグを指さないため）
  workflow_call:
    inputs:
      tag:
        description: "リリース対象タグ（例: v1.2.3）"
        required: true
        type: string

permissions:
  contents: write

env:
  NODE_VERSION: '20'
  # push 起動ではタグ、workflow_call 起動では入力値を採用する
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for changelog

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Run full CI checks
        run: |
          npx vue-tsc --noEmit
          npm run lint
          node scripts/validate-json.mjs

      - name: Build
        run: npm run build

      - name: Bundle size check
        run: node scripts/check-bundle-size.mjs

      - name: Create dist archive
        run: |
          TAG="${RELEASE_TAG}"
          zip -r "manual-game-${TAG}.zip" dist/
          tar -czf "manual-game-${TAG}.tar.gz" dist/

      - name: Generate changelog
        id: changelog
        run: |
          TAG="${RELEASE_TAG}"
          PREV=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -1)
          if [ -z "$PREV" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV}..${TAG}"
          fi

          CHANGES=$(git log "$RANGE" \
            --pretty=format:"- %s (%h)" \
            --no-merges \
            | head -50)

          # multiline safe output
          {
            echo "notes<<NOTES_EOF"
            echo "## 変更内容"
            echo ""
            echo "${CHANGES}"
            echo ""
            echo "## インストール"
            echo ""
            echo "\`manual-game-${TAG}.zip\` をダウンロードして展開し、\`dist/index.html\` をブラウザで開いてください。"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body: ${{ steps.changelog.outputs.notes }}
          draft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          files: |
            manual-game-${{ env.RELEASE_TAG }}.zip
            manual-game-${{ env.RELEASE_TAG }}.tar.gz
