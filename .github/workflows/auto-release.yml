name: Auto Tag & Release

# main へマージ/コミットされたら package.json の version を正として
# タグ v<version> を発行し、Release ワークフローを呼び出す。
# version を上げていないコミットではタグが既存のためスキップされる
# （＝毎コミットで Release を乱発しない）。
on:
  push:
    branches: [main]

# GITHUB_TOKEN で作成した push はワークフローを再起動しない（再帰防止）。
# そのため release は on:push tags ではなく workflow_call で明示的に呼ぶ。
permissions:
  contents: write

concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Tag if version bumped
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.detect.outputs.created }}
      tag: ${{ steps.detect.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 既存タグの照合に全履歴＋タグが必要

      - name: Detect version and create tag
        id: detect
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "既存タグ ${TAG} を検出。リリースはスキップします。"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "release: ${TAG}"
          git push origin "${TAG}"
          echo "新規タグ ${TAG} を作成しました。"
          echo "created=true" >> "$GITHUB_OUTPUT"

  release:
    name: Release
    needs: tag
    if: needs.tag.outputs.created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
